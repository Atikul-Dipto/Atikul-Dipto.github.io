# Per-site scraping configuration for run_pipeline.py.
#
# `verified: true` means the selectors below were checked against that
# site's actual rendered markup (see the notes on each site for how).
# `verified: false` means the site is a client-rendered app whose product
# grid never appears in a plain HTTP fetch, so the selectors are
# best-effort guesses. Run `python run_pipeline.py inspect <key>` and look
# at the saved page in data/debug/ before trusting an unverified site.
#
# card_selectors / name_selectors / price_selectors / original_price_selectors
# are each tried in order; the first selector that matches something wins.
# Add or reorder entries here as retailers change their markup.

daraz:
  name: Daraz
  urls:
    - "https://www.daraz.com.bd/catalog/?q=wireless+headphones"
    - "https://www.daraz.com.bd/catalog/?q=rice"
  card_selectors:
    - '[data-qa-locator="product-item"]'
    - ".product-item"
    - ".product-card"
    - "article[data-product-id]"
  name_selectors:
    - "[data-qa-locator='product-title']"
    - ".RfADt a"
    - ".title"
    - ".name"
    - "h2"
    - "h3"
    - "a"
  price_selectors:
    - "[data-qa-locator='product-price']"
    - ".aBrP0 .ooOxS"
    - ".price"
    - ".current-price"
    - ".sale-price"
  original_price_selectors:
    - "[data-qa-locator='product-original-price']"
    - ".original-price"
    - ".old-price"
    - "del"
    - "s"
  discount_selectors:
    - ".WNoq3 .IcOsH"
    - ".discount"
    - ".discount-rate"
    - ".sale-tag"
  banner_url: "https://www.daraz.com.bd/"
  banner_selectors:
    - ".pc-banner-slider-container .swiper-slide"
  verified: true
  wait_seconds: 25
  notes: >
    Client-rendered SPA. The card container keeps a stable
    data-qa-locator="product-item" attribute, but Daraz renders the title
    and price with hashed CSS-module class names (e.g. .RfADt, .aBrP0
    .ooOxS) that WILL change on Daraz's next frontend deploy — the
    data-qa-locator sub-attributes this project's original scraper relied
    on (product-title/product-price) no longer exist on those inner
    elements as of the last check. If this site starts returning 0 (or
    garbage/concatenated) prices, run
    `python run_pipeline.py inspect daraz`, open the saved HTML, and
    replace the hashed classes above with whatever Daraz is using now.

othoba:
  name: Othoba
  urls:
    - "https://othoba.com/food-grocery"
    - "https://othoba.com/food-grocery?page=2"
  card_selectors:
    - ".product.product-image-gap.product-simple"
    - ".product.product-widget"
    - ".product.product-list"
  name_selectors:
    - ".product-name"
  price_selectors:
    - ".product-price .new-price"
    - ".product-price"
  original_price_selectors:
    - ".product-price .old-price"
  banner_url: "https://www.othoba.com/"
  banner_selectors:
    - ".intro-slide"
  banner_image_attr: "data-background-image"
  banner_link_attr: "onclick"
  verified: true
  notes: >
    Confirmed against server-rendered HTML (nopCommerce-style storefront).
    Category pages (e.g. /food-grocery, used here to get grocery items that
    plausibly overlap with Shwapno/Cartup for the cross-platform comparison
    feature) use a different card class
    (.product.product-image-gap.product-simple) than the homepage's
    carousel widgets — both are kept in card_selectors. This site's own
    search route did not resolve to real search results when probed, so
    use category URLs rather than a search query template. Category-page
    cards reuse the "product-price" class on THREE unrelated elements per
    card (a sold-count line, an empty display:none mobile stub, and the
    real price) — first_text's "skip empty matches" behavior happens to
    land on the right one, but this is fragile; re-check with `inspect` if
    prices come back empty here. The banner
    carousel (.intro-slide) lazy-loads its image via a data-background-image
    attribute instead of a normal <img src>, and each slide navigates via
    an inline onclick="window.open(...)" instead of a real <a href> — both
    handled as special cases in scraper/banners.py, not the generic
    product scraper.

shwapno:
  name: Shwapno
  urls:
    - "https://www.shwapno.com/"
    - "https://www.shwapno.com/rice"
  card_selectors:
    - ".product-box-info"
  name_selectors:
    - ".product-box-title"
  price_selectors:
    - ".active-price"
  original_price_selectors:
    - ".old-price"
  banner_url: "https://www.shwapno.com/"
  banner_selectors:
    - ".single-banner"
  verified: true
  wait_seconds: 25
  notes: >
    Tailwind class names confirmed from the page's server-rendered loading
    skeleton, which is hydrated client-side using the same classes. Only
    lists featured products on the homepage; swap in a category URL for a
    specific product line. Its search route also returned the same
    skeleton content when probed, so prefer category URLs.

startech:
  name: Star Tech
  urls:
    - "https://www.startech.com.bd/product/search?search=headphone"
    - "https://www.startech.com.bd/product/search?search=laptop"
  card_selectors:
    - ".p-item"
  name_selectors:
    - ".p-item-name"
  price_selectors:
    - ".p-item-price .price-new"
    - ".p-item-price"
  original_price_selectors:
    - ".p-item-price .price-old"
  banner_url: "https://www.startech.com.bd/"
  banner_selectors:
    # A single comma-joined selector, not two fallback entries: card
    # selectors only try the next one if the first matches nothing
    # (see find_cards), but here both the hero slider and the two
    # secondary offer banners should show up together.
    - ".home-slider, .banner-item"
  verified: true
  notes: >
    Confirmed against real rendered search results, including a
    discounted item (.p-item-price holds both .price-new and .price-old
    spans side by side, so the current-price selector must target
    .price-new specifically or it concatenates both numbers). Search
    accepts ?search=<query> directly in the URL.

bikroy:
  name: Bikroy
  urls:
    - "https://bikroy.com/en/ads/bangladesh?q=headphone"
    - "https://bikroy.com/en/ads/bangladesh?q=mobile+phone"
  card_selectors:
    - ".js-advert-list-item"
  name_selectors:
    - ".qa-advert-title"
  price_selectors:
    - ".qa-advert-price"
  original_price_selectors: []
  banner_url: "https://bikroy.com/en"
  banner_selectors:
    - ".b-banner-list__block"
  verified: true
  notes: >
    Classifieds marketplace, not a retailer catalog. Each listing is an
    individual seller's ad with a single price and no strike-through
    original price, so discount_percent will always be empty here.

cartup:
  name: Cartup
  urls:
    - "https://cartup.com/"
  card_selectors:
    - 'a[href^="/product/"]'
  name_selectors:
    - "p.line-clamp-2"
  price_selectors:
    - "span.text-sm.font-bold"
  original_price_selectors:
    - ".line-through"
  banner_url: "https://cartup.com/"
  banner_selectors:
    # The hero swiper's root div has no distinguishing class of its own —
    # only its pagination control does (.home-slider) — so scope via the
    # parent-child relationship instead of a class that doesn't exist on
    # the container.
    - ".swiper:has(> .swiper-pagination.home-slider) .swiper-slide"
  verified: true
  wait_seconds: 30
  notes: >
    Next.js app; the product grid only appears after client-side
    hydration, so it never showed up in a plain HTTP fetch. Rendered it
    with Selenium directly and confirmed these selectors are correct
    against the homepage's featured-products carousel — unlike Daraz,
    Cartup's classes are plain Tailwind utility classes rather than
    build-hashed CSS modules, so they should be comparatively stable.
    Caveats: the homepage mixes this carousel with at least one other
    "trending" section whose cards use different markup entirely, so
    those get silently skipped (no name/price = no product, by design);
    the carousel also loop-duplicates its first few slides in the DOM, so
    duplicates collapse to one product via the source_url dedup in
    storage.py; and the homepage's product mix appears to rotate between
    loads. Net effect: yield per run is small and inconsistent from this
    URL. For reliable results, point this at a real category/search page
    instead of the homepage and raise --limit.

pickaboo:
  name: Pickaboo
  urls:
    - "https://www.pickaboo.com/product/laptop-notebook"
  card_selectors:
    - ".product-one"
  name_selectors:
    - ".product-title"
  price_selectors:
    - ".product-price span"
  original_price_selectors:
    - ".product-price s"
  banner_url: "https://www.pickaboo.com/"
  banner_selectors:
    - ".home-banner__slider__single"
  verified: true
  wait_seconds: 25
  notes: >
    Next.js app; confirmed against real rendered category-page output
    (readable class names, not build-hashed, so comparatively stable).
    A discounted card's .product-price holds both the current price in a
    <span> and the strikethrough original in an <s> with no separator
    between them ("194,500195,000" if you select the whole .product-price
    text) — same concatenation trap as Star Tech and Othoba, selectors
    scoped to the specific child tag to avoid it. "Out of stock" cards
    have no .product-price element at all and are silently skipped (no
    price = no product, by design). The homepage's hero slides have no
    href/onclick at all — not even a fake link — so banner link_url
    always falls back to the homepage itself (the generic fallback in
    scraper/banners.py already handles this; no special-casing needed
    here, unlike Othoba).

# A second new site was wanted alongside Pickaboo but didn't pan out:
# AjkerDeal's server doesn't respond at all (TCP connection times out on
# port 443, not a bot-block) as of 2026-08-27 — likely defunct. Ryans
# Computers was tried as a replacement and also dropped: it's behind a
# Cloudflare bot challenge ("Just a moment..." interstitial) —
# circumventing that is a different, more ToS-sensitive activity than the
# plain scraping used for every other site here, so it wasn't pursued.

packly:
  name: Packly
  urls:
    - "https://www.packly.com/"
  card_selectors:
    - '[class*="product-card" i]'
    - '[class*="ProductCard" i]'
    - 'a[href*="/product/"]'
  name_selectors:
    - "h2"
    - "h3"
    - '[class*="title" i]'
    - '[class*="name" i]'
  price_selectors:
    - '[class*="price" i]'
  original_price_selectors: []
  verified: false
  wait_seconds: 30
  notes: >
    Next.js app, same situation as cartup: no product markup in a plain
    HTTP fetch. Selectors are unverified guesses — run
    `python run_pipeline.py inspect packly` and fix them from the saved
    HTML before trusting this site's output. Note: packly.com appears to
    be a custom-packaging storefront rather than a general e-commerce
    catalog, so "products" here may need a different query URL entirely
    (e.g. a specific catalog/category page) to return anything useful.

chaldal:
  name: Chaldal
  urls:
    - "https://chaldal.com/"
  card_selectors:
    - '[class*="product" i]'
    - '[class*="Product" i]'
  name_selectors:
    - "h2"
    - "h3"
    - '[class*="name" i]'
  price_selectors:
    - '[class*="price" i]'
  original_price_selectors: []
  verified: false
  wait_seconds: 30
  notes: >
    React SPA that fetches its catalog via internal APIs after load; the
    homepage is not a product listing at all (no grid, just navigation).
    /search/<query> is NOT a real route (returns the app shell, checked
    2026-08-27) — the homepage's search box is a live JS autocomplete
    dropdown, not a link to a results page, so there's no plain URL to
    point this at without first finding the category pages (visible in
    the nav) or reverse-engineering the autocomplete's XHR endpoint.
    Verify with `python run_pipeline.py inspect chaldal` before relying
    on this site either way.
