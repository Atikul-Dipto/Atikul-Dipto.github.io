name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ecommerce-price-tracker/package-lock.json
            job-market-dashboard/package-lock.json
            silo/package-lock.json

      # Portfolio (site root)
      - run: npm ci
      - run: npm run build

      # Dashboards, served as sub-pages of the same Pages site.
      # Each sub-app sets its own `base` in vite.config.js to match the folder below.
      - name: Build Price Pulse -> /price-pulse/
        working-directory: ecommerce-price-tracker
        run: |
          npm ci
          npm run build
          mkdir -p ../dist/price-pulse
          cp -r dist/. ../dist/price-pulse/

      - name: Build Work Signal -> /work-signal/
        working-directory: job-market-dashboard
        run: |
          npm ci
          npm run build
          mkdir -p ../dist/work-signal
          cp -r dist/. ../dist/work-signal/

      - name: Build The Silo -> /silo/
        working-directory: silo
        run: |
          npm ci
          npm run build
          mkdir -p ../dist/silo
          cp -r dist/. ../dist/silo/
          # Employer logos are shared with the main site; the silo loads them
          # relative to its own base.
          cp -r ../public/logos ../dist/silo/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
